services:
  it-assets:
    build: .
    # OPS-8 (Track 9, найдено при аудите procure-it): тег с версией вместо
    # безымянного build-образа — виден в `docker images`/`docker compose ps`,
    # облегчает откат на предыдущую версию. Синхронизируется автоматически
    # из VERSION через scripts/sync-version.js (см. INFRA-4), как и версия
    # в README/docs/index.html — руками эту строку менять не нужно.
    image: it-assets:beta-1-26w38-08
    container_name: it-assets
    restart: unless-stopped
    # OPS-1 (Track 9, найдено при аудите procure-it): дефолт Docker для
    # SIGTERM→SIGKILL — 10 сек. Сервер теперь штатно обрабатывает SIGTERM
    # (WAL-чекпоинт + закрытие SQLite перед выходом, см. server/index.js),
    # но даём чуть больше времени с запасом на случай открытых keep-alive
    # соединений — сам сервер обычно укладывается в 1-2 сек.
    stop_grace_period: 15s
    ports:
      - "3000:3000"   # HTTP — редиректит на HTTPS
      - "3443:3443"   # HTTPS — основной, самоподписанный сертификат
    volumes:
      # Все данные (db.json, config.json, it-assets.sqlite, backups/,
      # cert.pem/key.pem) — в одном каталоге, переживают пересборку
      # и обновление образа.
      - it-assets-data:/data
    environment:
      # Можно переопределить порты/лимит бэкапов без пересборки образа:
      # - PORT=3000
      # - HTTPS_PORT=3443
      # - IT_ASSETS_BACKUP_MAX_MB=2048
      NODE_ENV: production
    healthcheck:
      # Тот же HEALTHCHECK, что и в Dockerfile — дублируется явно, чтобы
      # статус был виден прямо в `docker compose ps` (образ мог быть собран
      # где-то ещё и не содержать HEALTHCHECK, если Dockerfile правили).
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+(process.env.PORT||3000)+'/api/health').then(r=>{if(r.status!==200)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  it-assets-data:
